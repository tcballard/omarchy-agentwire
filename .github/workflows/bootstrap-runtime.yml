name: Bootstrap bundled runtime

on:
  push:
    branches: ["feat/native-zero-setup"]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the pinned AgentWire runtime
        shell: bash
        run: |
          set -euo pipefail
          source scripts/contract-revisions.sh
          rustup toolchain install "$AGENTWIRE_RUST_TOOLCHAIN" --profile minimal
          git init -q /tmp/AgentWire
          git -C /tmp/AgentWire remote add origin https://github.com/tcballard/AgentWire.git
          git -C /tmp/AgentWire fetch -q --depth=1 origin "$AGENTWIRE_REVISION"
          git -C /tmp/AgentWire checkout -q --detach FETCH_HEAD
          cargo "+$AGENTWIRE_RUST_TOOLCHAIN" build --release --locked \
            --manifest-path /tmp/AgentWire/Cargo.toml --target-dir /tmp/AgentWire-target
          install -m 0755 /tmp/AgentWire-target/release/agentwire bin/agentwire-x86_64
          sha256sum bin/agentwire-x86_64 > bin/agentwire-x86_64.sha256
      - name: Commit the generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bin/agentwire-x86_64 bin/agentwire-x86_64.sha256
          git commit -m "build: bundle pinned AgentWire runtime"
          git push origin "HEAD:$GITHUB_REF_NAME"
